<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Halloween-hälsning</title>

    <style>
        body {
            background-color: #190d2b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            color: orange;
            font-size: 42px;
        }

        p {
            font-size: 20px;
        }

        .pumpa {
            font-size: 80px;
        }

        .halsning {
            background-color: #302044;
            padding: 25px;
            border-radius: 20px;
            max-width: 600px;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <div class="pumpa">🎃 👻 🦇</div>

    <h1>Happy Halloween!</h1>

    <div class="halsning">
        <h2>Välkommen till min hemsökta sida!</h2>

        <p>
            Buuu! 👻 Vågar du gå in i mörkret?
        </p>

        <p>
            Se upp för spöken, häxor och flygande fladdermöss!
        </p>

        <p>
            Trick or treat! 🍬
        </p>

        <h2>Ha en riktigt läskig Halloween! 🕸️</h2>
    </div>

</body>
</html>
